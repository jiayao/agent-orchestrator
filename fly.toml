app = "agent-bus-relay"
primary_region = "lax"

# The relay is in-memory: one machine only (two machines = two separate
# channel logs = a fork; Fly's proxy round-robins between them). After
# `fly launch` (which creates two machines by default), run:
#     fly scale count 1
# max_machines_running pins that invariant in config so a stray scale-up
# cannot fork the log. Autostop is off: a stop wipes every channel, token,
# and message; chats must then be re-provisioned.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
